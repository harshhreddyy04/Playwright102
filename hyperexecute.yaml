version: "0.1"
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

# The tests run on both a Windows and a Linux HyperExecute VM in parallel; each opens a TestMu AI browser session.
runson: ${matrix.os}

# Playwright requires Node 20+; the default runner image ships Node 18.
runtime:
  language: node
  version: "20"

matrix:
  os: ["win", "linux"]
  project: ["chrome"]

testSuites:
  - npx playwright test --project=$project

# Injected environment variables (read by the tests / playwright.config.js).
env:
  BUILD_NAME: Playwright102
  TEST_MESSAGE: Welcome to TestMu AI
  BASE_URL: https://www.testmuai.com/selenium-playground/
  MIN_CAPS: "true"
  # Re-enable once the vault secrets exist (HyperExecute > Secrets); until then the runner's built-in LT_* variables are used.
  # LT_USERNAME: ${{ .secrets.LT_USERNAME }}
  # LT_ACCESS_KEY: ${{ .secrets.LT_ACCESS_KEY }}

# Dependency caching: node_modules is restored when package.json is unchanged.
cacheKey: '{{ checksum "package.json" }}'
cacheDirectories:
  - node_modules

pre:
  - npm install

post:
  - echo Finished $project on $os

# Artifacts Management: collected from every job and merged into one downloadable archive.
mergeArtifacts: true
uploadArtefacts:
  - name: playwright-report
    path:
      - playwright-report/**
  - name: test-results
    path:
      - test-results/**
